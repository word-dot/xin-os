[package]
name = "oscomp-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
axstd = { path = "../../arceos/ulib/axstd", features = [
    "defplat",
    "bus-mmio",
    "alloc",
    "fs",
    "myfs",
    "paging",
    "irq",
    "multitask",
    "net",
] }

# axfs-ng dependencies with ext4 enabled (using compatible lwext4_rust from git)
axfs-ng = { path = "../../arceos/modules/axfs-ng", features = ["ext4"] }
axfs-ng-vfs = { path = "../../arceos/crates/axfs-ng-vfs" }
axdriver = { path = "../../arceos/modules/axdriver", features = ["dyn", "block"] }

# xcore and xmodules - DISABLED for simplified migration
# xcore = { path = "../../xcore" }
# xprocess = { path = "../../xmodules/xprocess" }
# xsignal = { path = "../../xmodules/xsignal" }
# xuspace = { path = "../../xmodules/xuspace" }
# xvma = { path = "../../xmodules/xvma" }
# xutils = { path = "../../xmodules/xutils" }
# xcache = { path = "../../xmodules/xcache" }

# Keep old dependencies for compatibility during migration
ext4_view = { package = "ext4-view", path = "../ext4_view" }
axfs_ramfs = "0.1"
axfs_vfs = "0.1"

crate_interface = "0.3"
axlog = { path = "../../arceos/modules/axlog" }
log = "0.4"
bitflags = "2"
axmm = { path = "../../arceos/modules/axmm" }
axhal = { path = "../../arceos/modules/axhal" }
axalloc = { path = "../../arceos/modules/axalloc" }
axerrno = "0.2"
memory_addr = "0.4"
axtask = { path = "../../arceos/modules/axtask", features = ["smp"] }
axconfig = { path = "../../arceos/modules/axconfig" }
axsync = { path = "../../arceos/modules/axsync", features = ["multitask"] }
axns = { path = "../../arceos/modules/axns", features = ["thread-local"] }
axio = "0.1.1"
lazyinit = "0.2"
spin = "0.9"
shlex = { version = "1.3.0", default-features = false }
page_table_multiarch = "0.5.5"

[target.'cfg(target_arch = "riscv64")'.dependencies]
sbi-rt = "0.0.3"
riscv = "0.12"

[patch.crates-io]
virtio-drivers = { path = "../virtio-drivers" }
ext4-view = { path = "../ext4_view" }

[features]
axstd = []
