[package]
name = "xutils"
version = "0.1.0"
edition = "2024"

[dependencies]
axhal = { path = "../../arceos/modules/axhal" }
axfs-ng = { path = "../../arceos/modules/axfs-ng" }
axfs-ng-vfs = { path = "../../arceos/crates/axfs-ng-vfs" }
axlog = { path = "../../arceos/modules/axlog" }

axerrno = "0.2"
bitflags = "2.6"

bitmaps = { version = "3.2.1", default-features = false }
flatten_objects = "0.2.4"
linux-raw-sys = { version = "0.9.3", default-features = false, features = ["ioctl", "no_std", "general"] }
weak-map = { path = "../../vendor/weak-map" }
slab = { version = "0.4.9", default-features = false }
strum = { version = "0.26", default-features = false, features = ["derive"] }