[package]
name = "xcore"
version = "0.1.0"
edition = "2024"

[dependencies]
axconfig = { path = "../arceos/modules/axconfig" }
axfs-ng = { path = "../arceos/modules/axfs-ng" }
axfs-ng-vfs = { path = "../arceos/crates/axfs-ng-vfs" }
axhal = { path = "../arceos/modules/axhal" }
axlog = { path = "../arceos/modules/axlog" }
axmm = { path = "../arceos/modules/axmm" }
axnet = { path = "../arceos/modules/axnet" }
axns = { path = "../arceos/modules/axns", features = ["thread-local"] }
axsync = { path = "../arceos/modules/axsync", features = ["multitask"] }
axtask = { path = "../arceos/modules/axtask", features = ["smp"] }
axio = "0.1.1"
axalloc = { path = "../arceos/modules/axalloc" }

xcache = { path = "../xmodules/xcache" }
xprocess = { path = "../xmodules/xprocess" }
# xsignal = { path = "../xmodules/xsignal" }  # Disabled: incompatible TrapFrame API
xuspace = { path = "../xmodules/xuspace" }
xvma = { path = "../xmodules/xvma" }
xutils = { path = "../xmodules/xutils" }

axerrno = "0.2"
linkme = "0.3"
linux-raw-sys = { version = "0.9.3", default-features = false, features = ["no_std", "general", "net", "prctl", "system", "loop_device"] }
memory_addr = "0.4"
page_table_multiarch = "0.5.5"
spin = "0.9"

crate_interface = "0.1"
numeric-enum-macro = "0.2"
xmas-elf = "0.9"
cfg-if = "1.0"
lazy_static = "1.5"
page_table_entry = "0.5.5"
ctor_bare = "0.2.1"

chrono = { version = "0.4.41", default-features = false }
rand = { version = "0.9.1", default-features = false, features = ["alloc", "small_rng"] }
kernel-elf-parser = { path="../xmodules/kernel_elf_parser/" }
inherit-methods-macro = "0.1.0"
lock_api = "0.4.13"
